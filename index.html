<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendario lunar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#05070d; --panel:#0d121c; --line:#1f2836; --text:#e8ebf2; --muted:#8c97ab;
  --lit:#e9e6da; --dark:#1a2030; --accent:#8fd694; --accent-bg:#122219;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f1ea; --panel:#fbfaf6; --line:#d9d5c8; --text:#171a22; --muted:#667085;
    --lit:#f4d98a; --dark:#3a4256; --accent:#1f7a3d; --accent-bg:#e4f1e2; color-scheme:light;
  }
}
:root[data-theme="light"]{--bg:#f3f1ea;--panel:#fbfaf6;--line:#d9d5c8;--text:#171a22;--muted:#667085;--lit:#f4d98a;--dark:#3a4256;--accent:#1f7a3d;--accent-bg:#e4f1e2;color-scheme:light}
:root[data-theme="dark"]{--bg:#05070d;--panel:#0d121c;--line:#1f2836;--text:#e8ebf2;--muted:#8c97ab;--lit:#e9e6da;--dark:#1a2030;--accent:#8fd694;--accent-bg:#122219;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
h1,h2{font-family:Newsreader,Georgia,"Times New Roman",serif;font-weight:400;margin:0}
.hero{display:flex;gap:28px;align-items:center;padding:20px 0 28px;flex-wrap:wrap}
.hero img{display:block;width:min(190px,45vw);height:auto;flex:none;filter:drop-shadow(0 0 28px rgba(233,230,218,.18))}
.hero h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.1}
.hero .date{color:var(--muted);margin:4px 0 14px;text-transform:capitalize}
dl{display:grid;grid-template-columns:auto auto;gap:4px 28px;margin:0;font-size:1rem}
dt{color:var(--muted)} dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.bar h2{font-size:1.6rem;text-transform:capitalize}
.btns{display:flex;gap:6px}
button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible,.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scroll{overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(7,minmax(46px,1fr));gap:4px;min-width:340px}
.dow{color:var(--muted);font-size:.82rem;text-align:center;padding:4px 0}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 4px;min-height:92px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;text-align:center;font:inherit;color:inherit}
.cell.empty{background:none;border:none;cursor:default}
.cell .n{font-size:.85rem;color:var(--muted);align-self:flex-start;padding-left:4px}
.cell img{width:34px;height:34px}
.cell .p{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.cell .ev{font-size:.68rem;line-height:1.15;color:var(--accent)}
.cell.main{background:var(--accent-bg);border-color:var(--accent)}
.cell.today .n{color:var(--text);font-weight:600}
.cell.today{box-shadow:inset 0 0 0 1px var(--text)}
.cell.sel{outline:2px solid var(--text);outline-offset:-2px}
.list{margin:28px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.list li{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.list img{width:30px;height:30px;flex:none}
.list .t{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.note{color:var(--muted);font-size:.85rem;margin-top:24px}
@media (max-width:520px){.cell{min-height:80px}.cell img{width:28px;height:28px}.cell .ev{font-size:.62rem}}
</style>
</head>
<body>
<main>
  <section class="hero" aria-live="polite">
    <div id="heroMoon"></div>
    <div>
      <h1 id="heroName"></h1>
      <p class="date" id="heroDate"></p>
      <dl id="heroData"></dl>
    </div>
  </section>

  <div class="bar">
    <h2 id="monthTitle"></h2>
    <div class="btns">
      <button id="prev" aria-label="Mes anterior">‹</button>
      <button id="today">Hoy</button>
      <button id="next" aria-label="Mes siguiente">›</button>
    </div>
  </div>
  <div class="scroll"><div class="grid" id="grid"></div></div>

  <ul class="list" id="events"></ul>
  <p class="note">Horas para San Francisco del Oro, Chihuahua (hora del centro, UTC−6). Cálculo astronómico aproximado: la salida y puesta de la luna pueden variar unos minutos según el relieve del horizonte. El dibujo corresponde al hemisferio norte.</p>
</main>

<script>
const R = Math.PI / 180, SYN = 29.530588853;
const LAT = 26.865, LON = -105.84, TZ = "America/Chihuahua"; // San Francisco del Oro, Chihuahua (UTC−6 todo el año)
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const MAIN = ["Luna nueva","Cuarto creciente","Luna llena","Cuarto menguante"];
const NOMBRES = ["Luna nueva","Luna creciente","Cuarto creciente","Gibosa creciente","Luna llena","Gibosa menguante","Cuarto menguante","Luna menguante"];

function elong(t){
  const d = t/86400000 + 2440587.5 - 2451545;
  const L = 218.316 + 13.176396*d, Mp = 134.963 + 13.064993*d, D = 297.850 + 12.190749*d, g = 357.529 + 0.985600*d;
  const lm = L + 6.289*Math.sin(Mp*R) + 1.274*Math.sin((2*D-Mp)*R) + 0.658*Math.sin(2*D*R) + 0.214*Math.sin(2*Mp*R) - 0.186*Math.sin(g*R);
  const ls = 280.466 + 0.9856474*d + 1.915*Math.sin(g*R) + 0.020*Math.sin(2*g*R);
  return (((lm - ls) % 360) + 360) % 360;
}
function moonAlt(t){
  const d = t/86400000 + 2440587.5 - 2451545;
  const Mp = 134.963 + 13.064993*d, D = 297.850 + 12.190749*d, g = 357.529 + 0.985600*d, F = 93.272 + 13.229350*d;
  const lm = (218.316 + 13.176396*d + 6.289*Math.sin(Mp*R) + 1.274*Math.sin((2*D-Mp)*R) + 0.658*Math.sin(2*D*R) + 0.214*Math.sin(2*Mp*R) - 0.186*Math.sin(g*R))*R;
  const b = 5.128*Math.sin(F*R)*R, eps = (23.439 - 0.0000004*d)*R;
  const ra = Math.atan2(Math.sin(lm)*Math.cos(eps) - Math.tan(b)*Math.sin(eps), Math.cos(lm));
  const dec = Math.asin(Math.sin(b)*Math.cos(eps) + Math.cos(b)*Math.sin(eps)*Math.sin(lm));
  const H = (280.46061837 + 360.98564736629*d + LON)*R - ra;
  return Math.asin(Math.sin(LAT*R)*Math.sin(dec) + Math.cos(LAT*R)*Math.cos(dec)*Math.cos(H))/R;
}
function riseSet(y, m, d){
  const t0 = Date.UTC(y, m, d, 6), S = 600000, f = t => moonAlt(t) - 0.125, out = { rise: null, set: null };
  for (let t = t0; t < t0 + 86400000; t += S){
    const a = f(t), b = f(t + S);
    if ((a < 0) === (b < 0)) continue;
    let lo = t, hi = t + S;
    for (let i = 0; i < 20; i++){ const mid = (lo+hi)/2; ((f(mid) < 0) === (a < 0)) ? lo = mid : hi = mid; }
    if (a < 0 && !out.rise) out.rise = hi; else if (a >= 0 && !out.set) out.set = hi;
  }
  return out;
}
const hm = t => t ? hora(new Date(t)) : "—";
const illum = e => (1 - Math.cos(e*R)) / 2;
const nombre = e => NOMBRES[Math.round(e/45) % 8];

let TEX = null;
function paintMoon(e, size){
  const cv = document.createElement("canvas"); cv.width = cv.height = size;
  const ctx = cv.getContext("2d"); ctx.imageSmoothingQuality = "high"; ctx.drawImage(TEX, 0, 0, size, size);
  const im = ctx.getImageData(0, 0, size, size), p = im.data, sx = Math.sin(e*R), sz = -Math.cos(e*R);
  for (let j = 0; j < size; j++) for (let i = 0; i < size; i++){
    const x = (i+.5)/size*2-1, y = (j+.5)/size*2-1, r2 = x*x + y*y, k = (j*size + i)*4, r = Math.sqrt(r2);
    if (r > 1.02){ p[k+3] = 0; continue; }
    const z = Math.sqrt(Math.max(0, 1-r2)), dot = x*sx + z*sz;
    const t = Math.min(1, Math.max(0, (dot + .02)/.14)), f = .09 + .91*t*t*(3-2*t);
    p[k] *= f; p[k+1] *= f; p[k+2] *= f;
    p[k+3] = 255*Math.min(1, Math.max(0, (1-r)*size/2 + .5));
  }
  ctx.putImageData(im, 0, 0);
  return cv.toDataURL("image/png");
}
const MCACHE = {};
function moon(e, big){
  const size = big ? 380 : 64, k = size + ":" + Math.round(e)%360;
  if (!MCACHE[k]) MCACHE[k] = paintMoon(Math.round(e), size);
  return `<img src="${MCACHE[k]}" width="${size}" height="${size}" alt="${nombre(e)}">`;
}
function eventsBetween(t0, t1){
  const out = [], H = 3600000;
  for (let t = t0; t < t1; t += H){
    const q0 = Math.floor(elong(t)/90), q1 = Math.floor(elong(t+H)/90);
    if (q0 !== q1){
      let lo = t, hi = t + H;
      for (let i = 0; i < 22; i++){ const m = (lo+hi)/2; Math.floor(elong(m)/90) === q0 ? lo = m : hi = m; }
      out.push({ t: hi, i: q1 % 4 });
    }
  }
  return out;
}

function cityDay(t){ const c = new Date(t - 6*36e5); return new Date(c.getUTCFullYear(), c.getUTCMonth(), c.getUTCDate()); }
const now = cityDay(Date.now());
let year = now.getFullYear(), month = now.getMonth(), sel = new Date(now.getFullYear(), now.getMonth(), now.getDate());
const key = d => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
const hora = d => d.toLocaleTimeString("es", { hour: "2-digit", minute: "2-digit", timeZone: TZ });

const $ = id => document.getElementById(id);

function hero(){
  const noon = Date.UTC(sel.getFullYear(), sel.getMonth(), sel.getDate(), 18);
  const e = elong(noon);
  $("heroMoon").innerHTML = moon(e, true);
  $("heroName").textContent = nombre(e);
  $("heroDate").textContent = sel.toLocaleDateString("es", { weekday:"long", day:"numeric", month:"long", year:"numeric" }) + ", San Francisco del Oro";
  const rs = riseSet(sel.getFullYear(), sel.getMonth(), sel.getDate());
  $("heroData").innerHTML = `<dt>Sale la luna</dt><dd>${hm(rs.rise)}</dd><dt>Se oculta la luna</dt><dd>${hm(rs.set)}</dd><dt>Iluminación</dt><dd>${Math.round(illum(e)*100)}%</dd><dt>Edad lunar</dt><dd>${(e/360*SYN).toFixed(1)} días</dd><dt>Fase</dt><dd>${e < 180 ? "Creciente" : "Menguante"}</dd>`;
}

function render(){
  $("monthTitle").textContent = `${MESES[month]} ${year}`;
  const first = new Date(year, month, 1), days = new Date(year, month+1, 0).getDate();
  const evs = eventsBetween(Date.UTC(year, month, 1, 6), Date.UTC(year, month+1, 1, 6));
  const byDay = {};
  evs.forEach(ev => { byDay[key(cityDay(ev.t))] = ev; });

  let h = DIAS.map(d => `<div class="dow">${d}</div>`).join("");
  for (let i = 0; i < (first.getDay()+6)%7; i++) h += `<div class="cell empty"></div>`;
  for (let d = 1; d <= days; d++){
    const dt = new Date(year, month, d), e = elong(Date.UTC(year, month, d, 18)), ev = byDay[key(dt)];
    const cls = ["cell", ev ? "main" : "", key(dt) === key(now) ? "today" : "", key(dt) === key(sel) ? "sel" : ""].join(" ");
    h += `<button class="${cls}" data-d="${d}" aria-label="${d} de ${MESES[month]}: ${nombre(e)}, ${Math.round(illum(e)*100)}%"><span class="n">${d}</span>${moon(e)}<span class="p">${Math.round(illum(e)*100)}%</span>${ev ? `<span class="ev">${MAIN[ev.i]}<br>${hora(new Date(ev.t))}</span>` : ""}</button>`;
  }
  $("grid").innerHTML = h;
  $("events").innerHTML = evs.map(ev => {
    const dt = new Date(ev.t);
    return `<li>${moon(ev.i*90)}<strong>${MAIN[ev.i]}</strong><span class="t">${dt.toLocaleDateString("es",{weekday:"short",day:"numeric",month:"short",timeZone:TZ})}<br>${hora(dt)}</span></li>`;
  }).join("");
  hero();
}

$("grid").addEventListener("click", e => {
  const b = e.target.closest("[data-d]"); if (!b) return;
  sel = new Date(year, month, +b.dataset.d); render();
});
function go(n){ const d = new Date(year, month+n, 1); year = d.getFullYear(); month = d.getMonth(); render(); }
$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
$("today").onclick = () => { year = now.getFullYear(); month = now.getMonth(); sel = new Date(year, month, now.getDate()); render(); };
const photo = new Image();
photo.onload = () => { TEX = photo; render(); };
photo.onerror = () => { $("grid").textContent = "No se pudo cargar la imagen de la luna."; };
photo.src = MOON_PHOTO;
</script>
